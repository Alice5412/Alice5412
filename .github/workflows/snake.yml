name: Update snake

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake.svg profile/github-snake-dark.svg
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: update snake animation"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then break; fi
            echo "push attempt $i failed, retrying"
            sleep 5
          done